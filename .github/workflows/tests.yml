name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, pdo_sqlite, mbstring, intl, curl, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check dependencies for known vulnerabilities
        run: composer audit --no-interaction

      - name: Install ffmpeg (converts uploaded greetings and hold music)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: Create .env
        run: cp .env.example .env

      - name: Run tests
        run: php artisan test

  assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build front end
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
