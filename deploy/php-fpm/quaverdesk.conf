; QuaverDesk — dedicated PHP-FPM pool running as the quaverdesk user.
; Install: sudo cp deploy/php-fpm/quaverdesk.conf /etc/php/8.3/fpm/pool.d/quaverdesk.conf
;          sudo systemctl reload php8.3-fpm

[quaverdesk]
user = quaverdesk
group = quaverdesk

listen = /run/php/quaverdesk.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Sized for a small 2 vCPU / 4 GB server. Raise pm.max_children for more users.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

request_terminate_timeout = 60s

php_admin_value[memory_limit] = 256M
; nginx keeps every other request to 21 MB; only call recordings from the voice server are this big.
php_admin_value[upload_max_filesize] = 512M
php_admin_value[post_max_size] = 520M
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /srv/quaverdesk/storage/logs/php-fpm.log
