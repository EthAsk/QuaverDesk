# QuaverDesk — nginx site (HTTP only to start; certbot adds HTTPS and the redirect).
# Install:  sudo cp deploy/nginx/quaverdesk.conf /etc/nginx/sites-available/quaverdesk
#           sudo sed -i 's/phone.example.co.uk/YOUR.DOMAIN/' /etc/nginx/sites-available/quaverdesk
#           sudo ln -s /etc/nginx/sites-available/quaverdesk /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d YOUR.DOMAIN --redirect

server {
    listen 80;
    listen [::]:80;
    server_name phone.example.co.uk;

    root /srv/quaverdesk/public;
    index index.php;
    charset utf-8;

    # The largest upload is an admin's greeting or hold music (20 MB, see Admin → Sounds).
    client_max_body_size 21m;

    server_tokens off;
    fastcgi_hide_header X-Powered-By;

    access_log /var/log/nginx/quaverdesk.access.log;
    error_log  /var/log/nginx/quaverdesk.error.log warn;

    # Built assets have hashed names, so they can be cached for a long time.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Never serve dotfiles (.env, .git …) even if they end up under public/.
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The voice server uploads call recordings here when a call ends: up to 4 hours
    # (about 460 MB of WAV). Only it can use this path (shared secret).
    location ^~ /webhooks/voice/ {
        client_max_body_size 512m;
        client_body_timeout 120s;
        # Straight to Laravel's front controller (the shared snippet would look for a .php file).
        include fastcgi_params;
        fastcgi_pass unix:/run/php/quaverdesk.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
    }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/quaverdesk.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # The voice server waits on webhook replies mid-call; leave headroom.
        fastcgi_read_timeout 30s;
    }

    # Any other .php file is not part of the app.
    location ~ \.php$ {
        return 404;
    }
}
