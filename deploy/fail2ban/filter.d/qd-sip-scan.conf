# QuaverDesk: SIP scanners on the phone side (internal profile).
# Real phones and apps always call from user@<our domain>. Scanners send a bare IP address
# as the From host (e.g. test@188.214.132.74, 13237393003@185.8.104.160). The banned
# address is the real network source from "receiving invite from", which a caller can't fake.
[Definition]
failregex = \[INFO\] sofia\.c:\d+ sofia/internal/[^@\s]*@\[?[0-9a-fA-F.:]+\]? receiving invite from <HOST>:\d+ 
ignoreregex =
datepattern = {^LN-BEG}%%Y-%%m-%%d %%H:%%M:%%S\.%%f
